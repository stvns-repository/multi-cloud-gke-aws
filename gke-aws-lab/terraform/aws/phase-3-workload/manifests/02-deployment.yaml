apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-simulator
  namespace: workload-app
  labels:
    app: sre-simulator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sre-simulator
  template:
    metadata:
      labels:
        app: sre-simulator
    spec:
      containers:
      - name: simulator
        image: YOUR_ACCOUNT_ID.dkr.ecr.us-west-2.amazonaws.com/ecr-lab-05:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15