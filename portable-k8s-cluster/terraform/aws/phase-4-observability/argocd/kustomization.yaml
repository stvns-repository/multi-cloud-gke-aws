apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v2.11.3/manifests/install.yaml

patches:
  - target:
      kind: Deployment
      name: argocd-server
      namespace: argocd
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--basehref=/argocd"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--rootpath=/argocd"