name: Build and Push Phase 3 Workload
# This is for the Phase 3 of the lab. We'll push an image to AWS ECR.
on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'gke-aws-lab/terraform/aws/phase-3-workload/app/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2


    - name: Ensure ECR Repository Exists
      env:
        REPOSITORY: ecr-lab-05 # You can rename this to your liking.
        AWS_REGION: us-west-2
      run: |
        if aws ecr describe-repositories --repository-names "$REPOSITORY" --region "$AWS_REGION" > /dev/null 2>&1; then
          echo "ECR repository $REPOSITORY already exists."
        else
          echo "ECR repository $REPOSITORY does not exist. Creating..."
          aws ecr create-repository --repository-name "$REPOSITORY" --region "$AWS_REGION"
        fi

    - name: Build, Tag, and Push Image to Amazon ECR
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        REPOSITORY: ecr-lab-05
        IMAGE_TAG: latest
      working-directory: gke-aws-lab/terraform/aws/phase-3-workload/app
      run: |
        docker build --no-cache -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
        docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG